<!-- Created by 11Hopem -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#374151" stroke-width="4"/>

  <!-- Energy Pulse Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glowGrad)" stroke-width="5" stroke-dasharray="16 12" opacity="0.6" filter="url(#neonGlow)"/>

  <!-- Crescent Moon (Sleep Symbol) being shielded / electrified -->
  <path d="M210 120 C 310 120, 380 200, 360 310 C 345 220, 280 180, 210 180 C 190 180, 170 186, 150 196 C 175 148, 215 120, 210 120 Z" 
        fill="url(#glowGrad)" opacity="0.4" />

  <!-- Central Awake Iris & AI Brain Core -->
  <g transform="translate(0, 0)">
    <!-- Outer Awake Eye Shape -->
    <path d="M 120 256 Q 256 140 392 256 Q 256 372 120 256 Z" 
          fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
    
    <!-- Inner Lens Shield -->
    <circle cx="256" cy="256" r="64" fill="#0F172A" stroke="url(#glowGrad)" stroke-width="8"/>
    
    <!-- Awake Core Glow -->
    <circle cx="256" cy="256" r="32" fill="url(#accentGrad)" filter="url(#neonGlow)"/>
    <circle cx="256" cy="256" r="14" fill="#FFFFFF"/>
    
    <!-- AI Energy Rays (Never Sleep) -->
    <line x1="256" y1="90" x2="256" y2="120" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
    <line x1="256" y1="392" x2="256" y2="422" stroke="#6366F1" stroke-width="6" stroke-linecap="round" />
    <line x1="90" y1="256" x2="120" y2="256" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
    <line x1="392" y1="256" x2="422" y2="256" stroke="#A855F7" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Status Indicator Dot -->
  <circle cx="360" cy="150" r="16" fill="#10B981" filter="url(#neonGlow)"/>
  <circle cx="360" cy="150" r="8" fill="#FFFFFF"/>
</svg>
